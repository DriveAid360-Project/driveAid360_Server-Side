# Production Configuration for DriveAid360 Server
# Override with environment variables for security

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# Database Configuration - PostgreSQL (Production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/driveaid360}
spring.datasource.username=${DATABASE_USERNAME:driveaid360}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.driveaid360=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# OpenAPI/Swagger Configuration - Disable in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# JWT Configuration - MUST be overridden via environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Security - No default credentials in production
# Authentication must be done via JWT tokens
