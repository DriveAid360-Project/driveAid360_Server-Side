# Application Configuration
spring.application.name=driveaid360-server

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:driveaid360db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.com.driveaid360=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# JWT Configuration
# IMPORTANT: Override these in production using environment variables
# Example: JWT_SECRET=your-production-secret JWT_EXPIRATION=86400000
jwt.secret=${JWT_SECRET:driveaid360-super-secret-key-change-in-production-minimum-256-bits-required-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security Configuration (Development only - remove in production)
# IMPORTANT: These default credentials are for local development only
# In production, authentication should use JWT tokens via /api/v1/auth endpoints
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
